name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Lint, compile, and run the headless VS Code test suite on both OSes.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      # Linux needs a virtual display to launch the VS Code Electron host.
      - name: Test (headless VS Code, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (headless VS Code, Windows)
        if: runner.os == 'Windows'
        run: npm test

  # Package the VSIX once (the extension is platform-neutral) and publish the artifact.
  vsix:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npx @vscode/vsce package --out oxide-sloc.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-sloc-vsix
          path: oxide-sloc.vsix
          if-no-files-found: error
